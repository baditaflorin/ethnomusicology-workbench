<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ethnomusicology Workbench</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f8faf7;
        color: #17211b;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(760px, calc(100vw - 32px));
      }

      h1 {
        font-size: clamp(2rem, 5vw, 4rem);
        line-height: 1;
        margin: 0 0 1rem;
        letter-spacing: 0;
      }

      p {
        font-size: 1.1rem;
        line-height: 1.6;
      }

      a {
        color: #006a67;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ethnomusicology Workbench</h1>
      <p>
        Local-first field recording analysis is being published here. The full
        app is landing in the next commits.
      </p>
      <p>
        Repository:
        <a href="https://github.com/baditaflorin/ethnomusicology-workbench"
          >https://github.com/baditaflorin/ethnomusicology-workbench</a
        >
      </p>
    </main>
  </body>
</html>
